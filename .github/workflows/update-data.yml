# Aduce zilnic datele de ARAM Mayhem (ARAMKit) si le comite in repo. Aplicatia
# le ia la pornire (data_sync.py), deci userii au tier-uri/build-uri noi fara exe nou.
name: update-mayhem-data
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python ingame-app/update_aramkit.py
      - name: Commit daca s-a schimbat ceva
        run: |
          git config user.name "mayhem-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lcu-app/stats_data.json ingame-app/data
          git diff --cached --quiet || (git commit -m "data: ARAM Mayhem update" && git push)
